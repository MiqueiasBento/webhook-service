spring:
  application:
    name: webhook-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/webhook_service}
    username: ${SPRING_DATASOURCE_USERNAME:webhook}
    password: ${SPRING_DATASOURCE_PASSWORD:webhook}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  config:
    import: optional:file:.env[.properties]

webhook:
  security:
    allow-private-destinations: ${WEBHOOK_ALLOW_PRIVATE_DESTINATIONS:false}
  http:
    connect-timeout: 5s
    request-timeout: 10s
    max-event-bytes: 1048576
    max-response-bytes: 65536

  retry:
    max-attempts: 3
    initial-wait: 1s
    multiplier: 2

app:
  security:
    api-key: ${API_KEY}
