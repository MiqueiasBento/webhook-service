spring:
  application:
    name: webhook-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/webhook_service}
    username: ${SPRING_DATASOURCE_USERNAME:webhook}
    password: ${SPRING_DATASOURCE_PASSWORD:webhook}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

webhook:
  http:
    connect-timeout: 5s
    request-timeout: 10s
  retry:
    max-attempts: 3
    initial-wait: 1s
    multiplier: 2
