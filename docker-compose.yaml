services:
  app:
    profiles: ["full"]
    build: .
    container_name: webhook-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_service
      SPRING_DATASOURCE_USERNAME: webhook
      SPRING_DATASOURCE_PASSWORD: webhook
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ws-network
    
  postgres:
    image: postgres:17
    container_name: postgres-ws
    environment:
      POSTGRES_DB: webhook_service
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql-ws/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ws-network

networks:
  ws-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
